name: Extract ZIP

on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP file not found."
            exit 1
          fi

          mkdir -p .extract
          unzip -o "$ZIP" -d .extract

          rm "$ZIP"

          # ZIP内にプロジェクトフォルダが1つだけある場合は、
          # その中身をRepository直下へ移動
          if [ "$(find .extract -mindepth 1 -maxdepth 1 | wc -l)" = "1" ] && \
             [ -d "$(find .extract -mindepth 1 -maxdepth 1 | head -n 1)" ]; then

            ROOT=$(find .extract -mindepth 1 -maxdepth 1 | head -n 1)
            cp -a "$ROOT"/. .
          else
            cp -a .extract/. .
          fi

          rm -rf .extract

      - name: Remove workflow ZIP artifacts
        run: |
          find . -maxdepth 1 -type f -name "*.zip" -delete

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract project ZIP"
          git push
